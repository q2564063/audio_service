name: audio_service_example
description: Demonstrates how to use the audio_service plugin.
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  audio_session:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_audio_session.git"
      ref: "br_v0.2.2_ohos"
  audioplayers:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_audioplayers.git"
      path: "packages/audioplayers"
  video_player:
    git:
      url: "https://gitcode.com/openharmony-sig/flutter_packages.git"
      path: "packages/video_player/video_player"
  just_audio:
    git:
      url: "https://gitcode.com/openharmony-sig/fluttertpc_just_audio.git"
      path: "just_audio/"
      ref: "br_v0.10.4_ohos"
  flutter_tts: ^3.8.3
  device_info_plus: ^9.1.0
  android_content_provider: ^0.4.1
  permission_handler : ^11.0.1
  rxdart: ^0.27.2
  audio_service:
    path: ../
  audio_service_mpris: ^0.1.3
  just_audio_mpv: ^0.1.7

dependency_overrides:
  path_provider:
   git:
     url: https://gitcode.com/openharmony-sig/flutter_packages.git
     path: packages/path_provider/path_provider
  sqflite:
   git:
     url: https://gitcode.com/openharmony-sig/flutter_sqflite.git
     path: sqflite

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  # disable-swift-package-manager: true
  uses-material-design: true